name: happyheadlines

x-postgres: &postgres
  image: postgres:17-alpine
  environment: &postgres-env
    POSTGRES_USER: hh
    POSTGRES_PASSWORD: hh
  # Polls quickly while starting, then only every 30 s. -d avoids a FATAL "database hh does not exist" log line per check.
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U hh -d $${POSTGRES_DB}"]
    interval: 30s
    start_period: 60s
    start_interval: 2s
    timeout: 3s
    retries: 3
  restart: unless-stopped

x-redis: &redis
  image: redis:8-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 30s
    start_period: 30s
    start_interval: 2s
    timeout: 3s
    retries: 3
  restart: unless-stopped

x-dotnet-env: &dotnet-env
  Seq__Url: http://seq:5341
  Otlp__Endpoint: http://otel-collector:4317
  Otlp__SampleRatio: "0.1"
  RabbitMq__Host: rabbitmq
  OTEL_METRIC_EXPORT_INTERVAL: "30000"

# Release toggles. The API key is created once in the FeatureHub admin console and stored in .env (see README).
# Without it every toggle is off and the services run as before.
x-featurehub-env: &featurehub-env
  FeatureHub__EdgeUrl: http://featurehub:8085
  FeatureHub__ApiKey: ${FEATUREHUB_API_KEY:-}

x-article-service: &article-service
  image: ghcr.io/davud05/happyheadlines-article-service:${TAG:-latest}
  build:
    context: .
    args: { SERVICE: ArticleService }
  networks: [backbone, article-lane]
  restart: unless-stopped
  depends_on:
    rabbitmq: { condition: service_healthy }
    article-db-africa: { condition: service_healthy }
    article-db-antarctica: { condition: service_healthy }
    article-db-asia: { condition: service_healthy }
    article-db-europe: { condition: service_healthy }
    article-db-northamerica: { condition: service_healthy }
    article-db-oceania: { condition: service_healthy }
    article-db-southamerica: { condition: service_healthy }
    article-db-global: { condition: service_healthy }
    article-cache: { condition: service_healthy }

x-article-env: &article-env
  <<: *dotnet-env
  ConnectionStrings__ArticleCache: article-cache:6379
  ConnectionStrings__Africa: Host=article-db-africa;Database=articles;Username=hh;Password=hh
  ConnectionStrings__Antarctica: Host=article-db-antarctica;Database=articles;Username=hh;Password=hh
  ConnectionStrings__Asia: Host=article-db-asia;Database=articles;Username=hh;Password=hh
  ConnectionStrings__Europe: Host=article-db-europe;Database=articles;Username=hh;Password=hh
  ConnectionStrings__NorthAmerica: Host=article-db-northamerica;Database=articles;Username=hh;Password=hh
  ConnectionStrings__Oceania: Host=article-db-oceania;Database=articles;Username=hh;Password=hh
  ConnectionStrings__SouthAmerica: Host=article-db-southamerica;Database=articles;Username=hh;Password=hh
  ConnectionStrings__Global: Host=article-db-global;Database=articles;Username=hh;Password=hh

services:
  # ---------------------------------------------------------------- ArticleService swimlane
  article-lb:
    image: nginx:1.29-alpine
    volumes:
      - ./infra/nginx/article-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8000:80"]
    networks: [backbone]
    depends_on: [article-service-1, article-service-2, article-service-3]
    restart: unless-stopped

  article-service-1:
    <<: *article-service
    environment: { <<: *article-env, INSTANCE_ID: article-service-1 }
  article-service-2:
    <<: *article-service
    environment: { <<: *article-env, INSTANCE_ID: article-service-2 }
  article-service-3:
    <<: *article-service
    environment: { <<: *article-env, INSTANCE_ID: article-service-3 }

  article-db-africa: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-africa:/var/lib/postgresql/data] }
  article-db-antarctica: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-antarctica:/var/lib/postgresql/data] }
  article-db-asia: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-asia:/var/lib/postgresql/data] }
  article-db-europe: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-europe:/var/lib/postgresql/data] }
  article-db-northamerica: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-northamerica:/var/lib/postgresql/data] }
  article-db-oceania: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-oceania:/var/lib/postgresql/data] }
  article-db-southamerica: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-southamerica:/var/lib/postgresql/data] }
  article-db-global: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: articles }, networks: [article-lane], volumes: [article-global:/var/lib/postgresql/data] }

  # Offline cache of the last 14 days, filled by ArticleService itself. No eviction: losing entries silently would break the window.
  article-cache:
    <<: *redis
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", ""]
    networks: [article-lane]

  # ---------------------------------------------------------------- CommentService swimlane
  comment-service:
    image: ghcr.io/davud05/happyheadlines-comment-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: CommentService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Comments: Host=comment-db;Database=comments;Username=hh;Password=hh
      ConnectionStrings__CommentCache: comment-cache:6379
      Services__Profanity: http://profanity-service:8080
    ports: ["8001:8080"]
    networks: [backbone, comment-lane]
    depends_on:
      comment-db: { condition: service_healthy }
      comment-cache: { condition: service_healthy }
    restart: unless-stopped

  comment-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: comments }, networks: [comment-lane], volumes: [comments:/var/lib/postgresql/data] }

  # Cache-aside comment cache. Capped memory with LRU eviction of the least recently read articles.
  comment-cache:
    <<: *redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [comment-lane]

  # ---------------------------------------------------------------- ProfanityService swimlane
  profanity-service:
    image: ghcr.io/davud05/happyheadlines-profanity-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: ProfanityService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Profanity: Host=profanity-db;Database=profanity;Username=hh;Password=hh
    ports: ["8002:8080"]
    networks: [backbone, profanity-lane]
    depends_on:
      profanity-db: { condition: service_healthy }
    restart: unless-stopped

  profanity-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: profanity }, networks: [profanity-lane], volumes: [profanity:/var/lib/postgresql/data] }

  # ---------------------------------------------------------------- DraftService swimlane
  draft-service:
    image: ghcr.io/davud05/happyheadlines-draft-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: DraftService } }
    environment:
      <<: *dotnet-env
      ConnectionStrings__Drafts: Host=draft-db;Database=drafts;Username=hh;Password=hh
    ports: ["8003:8080"]
    networks: [backbone, draft-lane]
    depends_on:
      draft-db: { condition: service_healthy }
    restart: unless-stopped

  draft-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: drafts }, networks: [draft-lane], volumes: [drafts:/var/lib/postgresql/data] }

  # ---------------------------------------------------------------- Readers
  website:
    image: ghcr.io/davud05/happyheadlines-website:${TAG:-latest}
    build: { context: ., args: { SERVICE: Website } }
    environment:
      <<: [*dotnet-env, *featurehub-env]
      Services__Articles: http://article-lb
      Services__Comments: http://comment-service:8080
      Services__Subscribers: http://subscriber-service:8080
    ports: ["5000:8080"]
    networks: [backbone]
    restart: unless-stopped

  # ---------------------------------------------------------------- Publishing
  webapp:
    image: ghcr.io/davud05/happyheadlines-webapp:${TAG:-latest}
    build: { context: ., args: { SERVICE: Webapp } }
    environment:
      <<: *dotnet-env
      Services__Drafts: http://draft-service:8080
      Services__Publisher: http://publisher-service:8080
    ports: ["5001:8080"]
    networks: [backbone]
    restart: unless-stopped

  publisher-service:
    image: ghcr.io/davud05/happyheadlines-publisher-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: PublisherService } }
    environment:
      <<: *dotnet-env
      Services__Profanity: http://profanity-service:8080
    ports: ["8004:8080"]
    networks: [backbone]
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["15672:15672"]
    networks: [backbone]
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      start_period: 90s
      start_interval: 3s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------- SubscriberService swimlane
  # Behind the SUBSCRIBER_SERVICE release toggle. Only talks to NewsletterService through SubscriberQueue.
  subscriber-service:
    image: ghcr.io/davud05/happyheadlines-subscriber-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: SubscriberService } }
    environment:
      <<: [*dotnet-env, *featurehub-env]
      ConnectionStrings__Subscribers: Host=subscriber-db;Database=subscribers;Username=hh;Password=hh
    ports: ["8006:8080"]
    networks: [backbone, subscriber-lane]
    depends_on:
      rabbitmq: { condition: service_healthy }
      subscriber-db: { condition: service_healthy }
    restart: unless-stopped

  subscriber-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: subscribers }, networks: [subscriber-lane], volumes: [subscribers:/var/lib/postgresql/data] }

  # ---------------------------------------------------------------- NewsletterService swimlane
  # Keeps its own copy of the subscribers (newsletter-db), so it never calls SubscriberService.
  newsletter-service:
    image: ghcr.io/davud05/happyheadlines-newsletter-service:${TAG:-latest}
    build: { context: ., args: { SERVICE: NewsletterService } }
    environment:
      <<: [*dotnet-env, *featurehub-env]
      ConnectionStrings__Newsletter: Host=newsletter-db;Database=newsletter;Username=hh;Password=hh
      Services__Articles: http://article-lb
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      # Legacy recipients, used while the SUBSCRIBER_SERVICE toggle is off.
      Newsletter__Subscribers__0: anna@example.com
      Newsletter__Subscribers__1: lars@example.com
    ports: ["8005:8080"]
    networks: [backbone, newsletter-lane]
    depends_on:
      rabbitmq: { condition: service_healthy }
      newsletter-db: { condition: service_healthy }
    restart: unless-stopped

  newsletter-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: newsletter }, networks: [newsletter-lane], volumes: [newsletter:/var/lib/postgresql/data] }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    networks: [backbone]
    restart: unless-stopped

  # ---------------------------------------------------------------- Feature toggles
  # FeatureHub Party Server: admin console and the Edge API the SDKs stream toggles from, both on port 8085.
  # No service depends_on it: if FeatureHub is down, services keep their last known toggle values (off at startup).
  featurehub:
    image: featurehub/party-server:1.10.1
    environment:
      db.url: jdbc:postgresql://featurehub-db:5432/featurehub
      db.username: hh
      db.password: hh
    ports: ["8085:8085"]
    networks: [backbone, featurehub-lane]
    depends_on:
      featurehub-db: { condition: service_healthy }
    restart: unless-stopped

  featurehub-db: { <<: *postgres, environment: { <<: *postgres-env, POSTGRES_DB: featurehub }, networks: [featurehub-lane], volumes: [featurehub:/var/lib/postgresql/data] }

  # ---------------------------------------------------------------- Observability
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports: ["5380:80"]
    networks: [backbone]
    volumes: [seq:/data]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [backbone]
    depends_on: [jaeger]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686"]
    networks: [backbone]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [backbone]
    depends_on: [otel-collector]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cache-hit-ratio.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [backbone]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  backbone:
  article-lane:
  comment-lane:
  profanity-lane:
  draft-lane:
  subscriber-lane:
  newsletter-lane:
  featurehub-lane:

volumes:
  rabbitmq:
  drafts:
  comments:
  profanity:
  subscribers:
  newsletter:
  featurehub:
  article-africa:
  article-antarctica:
  article-asia:
  article-europe:
  article-northamerica:
  article-oceania:
  article-southamerica:
  article-global:
  seq:
