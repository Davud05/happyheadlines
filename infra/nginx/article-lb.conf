# X-axis split: three identical ArticleService instances behind a round-robin load balancer.
upstream article_service {
    server article-service-1:8080 max_fails=3 fail_timeout=10s;
    server article-service-2:8080 max_fails=3 fail_timeout=10s;
    server article-service-3:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://article_service;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
    }
}
