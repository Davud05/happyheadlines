# X-axis split: three identical ArticleService instances behind a round-robin load balancer.

# Docker's embedded DNS. Re-resolving keeps the upstreams correct when containers are recreated with new IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream article_service {
    zone article_service 64k;
    server article-service-1:8080 resolve max_fails=3 fail_timeout=10s;
    server article-service-2:8080 resolve max_fails=3 fail_timeout=10s;
    server article-service-3:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    # Requests are already traced and logged by ArticleService; failed upstreams still go to the error log.
    access_log off;

    location / {
        proxy_pass http://article_service;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
    }
}
